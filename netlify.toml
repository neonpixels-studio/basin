# Production deploys: `npm run build` is `dotenvx run -f .env.production --
# nuxt build --dotenv .env.production`, so it decrypts .env.production with
# DOTENV_PRIVATE_KEY_PRODUCTION (set in Netlify env, Builds scope) and bakes
# NUXT_* values into the bundle. The `--dotenv` flag points Nuxt's own env
# loader at that same file rather than its default (the repo-root .env): every
# key is already in process.env from dotenvx by then, so Nuxt has nothing to
# backfill. Without it, any key missing from .env.production gets .env's
# committed *ciphertext* as its literal value, since no DOTENV_PRIVATE_KEY for
# .env exists here — see tests/env/envFileKeyParity.test.ts.
[build]
  command = "npm run test:ci && npm run build"
  publish = "dist"

# Deploy previews and branch deploys decrypt .env.dev instead, via
# DOTENV_PRIVATE_KEY_DEV, so they never build against the production database.
[context.deploy-preview]
  command = "npm run test:ci && npm run build:dev"

[context.branch-deploy]
  command = "npm run test:ci && npm run build:dev"

# Functions run at runtime as standalone Lambdas: they don't get the
# dotenvx-decrypted values that `nuxt build` bakes into the app bundle. Ship the
# encrypted env files so netlify/functions/env.ts can decrypt them at runtime
# with DOTENV_PRIVATE_KEY_* (which must be scoped to Functions in Netlify env).
[functions]
  directory = "netlify/functions"
  included_files = [".env.production", ".env.dev"]

# Netlify cancels the build when an ignore command exits 0 and builds on exit 1.
# A context-level `ignore` replaces the one in [build], so a production branch in
# [build] would be dead code; this is the only rule that applies to production.
# Production deploys only via the build hook (weekly workflow or manual dispatch);
# every other context has no ignore command and always builds.
[context.production]
  ignore = "if [ -n \"$INCOMING_HOOK_TITLE\" ]; then exit 1; else exit 0; fi"
